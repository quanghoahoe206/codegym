<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
            color: #333;
        }
        h1 {
            color: #1a365d;
            border-bottom: 2px solid #2b6cb0;
            padding-bottom: 8px;
            max-width: 600px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 16px;
            text-align: left;
        }
        th {
            background-color: #2b6cb0;
            color: #ffffff;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f8fafc;
        }
        tr:hover {
            background-color: #edf2f7;
        }
        .price, .qty {
            text-align: right;
        }
        th.price, th.qty {
            text-align: right;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th class="price">Giá</th>
            <th class="qty">Số lượng</th>
        </tr>
        <tr>
            <td>Bàn phím cơ DareU</td>
            <td class="price">650.000 VNĐ</td>
            <td class="qty">15</td>
        </tr>
        <tr>
            <td>Chuột không dây Logitech</td>
            <td class="price">350.000 VNĐ</td>
            <td class="qty">25</td>
        </tr>
        <tr>
            <td>Tai nghe Gaming Kingston</td>
            <td class="price">1.200.000 VNĐ</td>
            <td class="qty">10</td>
        </tr>
        <tr>
            <td>Lót chuột cỡ lớn RGB</td>
            <td class="price">150.000 VNĐ</td>
            <td class="qty">40</td>
        </tr>
    </table>

</body>
</html>
